name: Deploy to BananaHosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.empresasalfate.cl
          username: deploy@empresasalfate.cl
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/exhbjzic/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            .github/**
